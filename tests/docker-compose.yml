services:
  postgres-test:
    image: postgres:16-alpine
    container_name: teamxtreme-postgres-test
    environment:
      POSTGRES_USER: teamxtreme_test
      POSTGRES_PASSWORD: teamxtreme_test
      POSTGRES_DB: teamxtreme_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamxtreme_test"]
      interval: 2s
      timeout: 5s
      retries: 10
