services:
  postgres-test:
    image: postgres:16-alpine
    container_name: teamxtreme-postgres-test
    environment:
      POSTGRES_USER: teamxtreme_test
      POSTGRES_PASSWORD: teamxtreme_test
      POSTGRES_DB: teamxtreme_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamxtreme_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  clamav-test:
    image: clamav/clamav-debian:1.4
    container_name: teamxtreme-clamav-test
    ports:
      - "3311:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
