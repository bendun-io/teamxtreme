<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="TeamXtreme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a" />
      <stop offset="1" stop-color="#3a0d12" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="400" fill="url(#bg)" />

  <!-- diagonal belt-stripe accents -->
  <g opacity="0.5">
    <polygon points="560,400 660,400 900,180 840,180" fill="#7e161f" />
    <polygon points="700,400 730,400 940,210 915,210" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- emblem: belt knot echoing the app icon, right side -->
  <g transform="translate(730,190)" opacity="0.9">
    <circle r="150" fill="url(#ringGlow)" />
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M -95 -80 L 70 55" />
      <path d="M 95 -80 L -70 55" />
    </g>
    <rect x="-12" y="0" width="24" height="100" rx="4" fill="#ffffff" fill-opacity="0.85" />
    <rect x="-12" y="52" width="24" height="24" fill="#7e161f" />
    <circle r="17" fill="#141414" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" />
  </g>
</svg>
