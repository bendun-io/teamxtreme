<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="TeamXtreme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a" />
      <stop offset="1" stop-color="#3a0d12" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="400" fill="url(#bg)" />

  <!-- diagonal belt-stripe accents -->
  <g opacity="0.5">
    <polygon points="560,400 660,400 900,180 840,180" fill="#7e161f" />
    <polygon points="700,400 730,400 940,210 915,210" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- emblem: tied black-belt knot echoing the app icon, right side -->
  <g transform="translate(730,190)" opacity="0.95">
    <circle r="150" fill="url(#ringGlow)" />
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

    <!-- belt wrapping around the waist, almost horizontal into the knot, black with white edge piping -->
    <g stroke-linecap="round" fill="none">
      <path d="M -100 -25 L -9 -3" stroke="#f5f5f5" stroke-width="17" stroke-opacity="0.9" />
      <path d="M -100 -25 L -9 -3" stroke="#141414" stroke-width="12" />
      <path d="M 100 -25 L 9 -3" stroke="#f5f5f5" stroke-width="17" stroke-opacity="0.9" />
      <path d="M 100 -25 L 9 -3" stroke="#141414" stroke-width="12" />
    </g>

    <!-- the knot itself -->
    <rect x="-20" y="-11" width="40" height="34" rx="10" fill="#f5f5f5" fill-opacity="0.9" />
    <rect x="-17" y="-9" width="34" height="30" rx="8" fill="#141414" />

    <!-- two tails hanging diagonally down from the knot, splayed apart -->
    <g stroke-linecap="round" fill="none">
      <path d="M -9 22 L -36 96" stroke="#f5f5f5" stroke-width="17" stroke-opacity="0.9" />
      <path d="M -9 22 L -36 96" stroke="#141414" stroke-width="12" />
      <path d="M -25 66 L -36 96" stroke="#7e161f" stroke-width="12" />

      <path d="M 9 22 L 34 88" stroke="#f5f5f5" stroke-width="17" stroke-opacity="0.9" />
      <path d="M 9 22 L 34 88" stroke="#141414" stroke-width="12" />
    </g>
  </g>
</svg>
