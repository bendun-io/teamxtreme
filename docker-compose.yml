services:
  teamxtreme-server:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: teamxtreme-server
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-teamxtreme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teamxtreme}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-https://teamxtreme.bendun.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET}
    volumes:
      - uploads-data:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: teamxtreme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamxtreme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teamxtreme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamxtreme}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav-debian:1.4
    container_name: teamxtreme-clamav
    restart: unless-stopped
    environment:
      # clamd's compiled-in defaults (StreamMaxLength/MaxFileSize/MaxScanSize
      # = 100M) are well under the 500 MB media upload cap (see
      # src/backend/src/routes/media.js) — without raising them, clamd
      # aborts the scan of any larger photo/video and the upload fails with
      # a 500. The image's entrypoint rewrites the matching `#Directive`
      # line in clamd.conf for every CLAMD_CONF_* var (see its /init script).
      CLAMD_CONF_StreamMaxLength: 550M
      CLAMD_CONF_MaxFileSize: 550M
      CLAMD_CONF_MaxScanSize: 550M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUD_FLARE_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
  clamav-data: